<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Annotation Tool</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, sans-serif; margin: 18px; background: #f5f7fa; color: #1b2733; }
    .card { background: #fff; border: 1px solid #d8e0e8; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { background: #1f6feb; color: white; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button:disabled { background: #8ba9d6; cursor: default; }
    .ctx { background: #f0f4f8; border-left: 4px solid #1f6feb; padding: 8px; margin-top: 6px; }
    .muted { color: #4e5d6b; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  </style>
</head>
<body>
  <h1>Gold Annotation Tool</h1>
  <p class="muted">Load turn index and produce 300-turn annotation set. Also supports inter-annotator agreement from two annotation files.</p>

  <div class="card">
    <div class="row">
      <label>Turn index CSV: <input type="file" id="turnIndexInput" accept=".csv" /></label>
      <button id="sampleBtn" disabled>Sample 300 Turns</button>
      <button id="downloadBtn" disabled>Download gold_annotations.json</button>
    </div>
  </div>

  <div class="card">
    <div id="status">No sample loaded.</div>
    <div id="turnPane"></div>
    <div class="row" style="margin-top:10px;">
      <button id="prevBtn" disabled>Prev</button>
      <button id="nextBtn" disabled>Next</button>
    </div>
  </div>

  <div class="card">
    <h2>IAA</h2>
    <div class="row">
      <label>Annotator A JSON: <input type="file" id="annA" accept=".json" /></label>
      <label>Annotator B JSON: <input type="file" id="annB" accept=".json" /></label>
      <button id="computeIaaBtn" disabled>Compute Kappa + Pearson r</button>
    </div>
    <pre id="iaaOut"></pre>
  </div>

<script>
const ACTIONS = [
  "Ask_for_Information", "Provide_Solution", "Affective_Repair", "Escalate_to_Human",
  "Close_with_Feedback", "Proactive_Update", "Set_Expectation", "Unknown"
];

let indexRows = [];
let sampled = [];
let pos = 0;
let annMap = new Map();
let annAData = null;
let annBData = null;

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(Boolean);
  if (!lines.length) return [];
  const header = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const obj = {};
    header.forEach((h, i) => obj[h] = cols[i] ?? "");
    return obj;
  });
}

function stratifiedSample(rows, nPerDomain = 150) {
  const byDomain = {
    twitter_cs: rows.filter(r => r.domain_source === "twitter_cs"),
    open_assistant: rows.filter(r => r.domain_source === "open_assistant"),
  };

  function pickDomain(domainRows, n) {
    const byAction = {};
    ACTIONS.forEach(a => byAction[a] = []);
    domainRows.forEach(r => byAction[r.action_label || "Unknown"]?.push(r));

    const perClass = Math.max(1, Math.floor(n / ACTIONS.length));
    const out = [];
    ACTIONS.forEach(a => {
      const pool = [...(byAction[a] || [])];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      out.push(...pool.slice(0, perClass));
    });
    if (out.length < n) {
      const remaining = domainRows.filter(r => !out.includes(r));
      for (let i = remaining.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
      }
      out.push(...remaining.slice(0, n - out.length));
    }
    return out.slice(0, n);
  }

  return [...pickDomain(byDomain.twitter_cs, nPerDomain), ...pickDomain(byDomain.open_assistant, nPerDomain)];
}

function getContextRows(cur) {
  const convRows = indexRows.filter(r => r.conv_id === cur.conv_id);
  const idx = convRows.findIndex(r => r.turn_id === cur.turn_id || String(r.turn_id) === String(cur.turn_id));
  if (idx < 0) return convRows.slice(0, 7);
  return convRows.slice(Math.max(0, idx - 3), Math.min(convRows.length, idx + 4));
}

function renderTurn() {
  const pane = document.getElementById("turnPane");
  if (!sampled.length) {
    pane.innerHTML = "";
    return;
  }
  const t = sampled[pos];
  const ann = annMap.get(t._id) || { action_label: "", sentiment_score: 0, frustration_score: 0, confident: false };
  const ctx = getContextRows(t).map(r => `<div class=\"ctx\"><b>${r.speaker_role}</b>: ${r.text}</div>`).join("");

  pane.innerHTML = `
    <div class="muted">Turn ${pos + 1} / ${sampled.length} | conv_id=${t.conv_id} | domain=${t.domain_source}</div>
    ${ctx}
    <div class="grid" style="margin-top:10px;">
      <div>
        <label>Action label</label><br/>
        ${ACTIONS.map(a => `<label><input type="radio" name="action_label" value="${a}" ${ann.action_label===a?"checked":""}/> ${a}</label><br/>`).join("")}
      </div>
      <div>
        <label>Sentiment: <span id="sentValue">${ann.sentiment_score}</span></label>
        <input type="range" id="sentRange" min="-1" max="1" step="0.01" value="${ann.sentiment_score}" />
        <label>Frustration: <span id="frValue">${ann.frustration_score}</span></label>
        <input type="range" id="frRange" min="0" max="1" step="0.01" value="${ann.frustration_score}" />
        <label><input type="checkbox" id="confBox" ${ann.confident?"checked":""}/> I am confident in this label</label>
      </div>
    </div>
  `;

  pane.querySelectorAll('input[name="action_label"]').forEach(el => {
    el.addEventListener("change", saveCurrent);
  });
  document.getElementById("sentRange").addEventListener("input", e => {
    document.getElementById("sentValue").textContent = e.target.value;
    saveCurrent();
  });
  document.getElementById("frRange").addEventListener("input", e => {
    document.getElementById("frValue").textContent = e.target.value;
    saveCurrent();
  });
  document.getElementById("confBox").addEventListener("change", saveCurrent);

  document.getElementById("status").textContent = `Annotated ${annMap.size} / ${sampled.length}`;
}

function saveCurrent() {
  if (!sampled.length) return;
  const t = sampled[pos];
  const picked = document.querySelector('input[name="action_label"]:checked');
  annMap.set(t._id, {
    action_label: picked ? picked.value : "",
    sentiment_score: parseFloat(document.getElementById("sentRange")?.value ?? "0"),
    frustration_score: parseFloat(document.getElementById("frRange")?.value ?? "0"),
    confident: !!document.getElementById("confBox")?.checked,
  });
  document.getElementById("status").textContent = `Annotated ${annMap.size} / ${sampled.length}`;
}

function exportAnnotations() {
  const out = sampled.map(t => ({
    turn_key: t._id,
    conv_id: t.conv_id,
    turn_id: t.turn_id,
    domain_source: t.domain_source,
    text: t.text,
    ...(annMap.get(t._id) || {}),
  }));
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gold_annotations.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function confusionMatrix(labelsA, labelsB) {
  const m = {};
  ACTIONS.forEach(a => { m[a] = {}; ACTIONS.forEach(b => m[a][b] = 0); });
  for (let i = 0; i < labelsA.length; i++) {
    const a = labelsA[i] || "Unknown";
    const b = labelsB[i] || "Unknown";
    if (m[a] && m[a][b] !== undefined) m[a][b] += 1;
  }
  return m;
}

function cohenKappa(labelsA, labelsB) {
  const n = labelsA.length;
  if (!n) return 0;
  let agree = 0;
  const pa = {}, pb = {};
  ACTIONS.forEach(a => { pa[a] = 0; pb[a] = 0; });
  for (let i = 0; i < n; i++) {
    const a = labelsA[i] || "Unknown";
    const b = labelsB[i] || "Unknown";
    if (a === b) agree += 1;
    pa[a] = (pa[a] || 0) + 1;
    pb[b] = (pb[b] || 0) + 1;
  }
  const p0 = agree / n;
  let pe = 0;
  ACTIONS.forEach(a => pe += (pa[a] / n) * (pb[a] / n));
  return (1 - pe) === 0 ? 0 : (p0 - pe) / (1 - pe);
}

function pearson(xs, ys) {
  const n = xs.length;
  if (!n) return 0;
  const mx = xs.reduce((a,b)=>a+b,0)/n;
  const my = ys.reduce((a,b)=>a+b,0)/n;
  let num = 0, dx = 0, dy = 0;
  for (let i=0;i<n;i++) {
    const vx = xs[i]-mx, vy = ys[i]-my;
    num += vx*vy; dx += vx*vx; dy += vy*vy;
  }
  return num / Math.sqrt((dx || 1e-9) * (dy || 1e-9));
}

function parseAnnFile(text) {
  const arr = JSON.parse(text);
  const m = new Map();
  arr.forEach(x => m.set(x.turn_key, x));
  return m;
}

function computeIAA() {
  const common = [];
  annAData.forEach((_v, k) => { if (annBData.has(k)) common.push(k); });
  const labelsA = [], labelsB = [], sentA = [], sentB = [], frA = [], frB = [];
  common.forEach(k => {
    const a = annAData.get(k), b = annBData.get(k);
    labelsA.push(a.action_label || "Unknown");
    labelsB.push(b.action_label || "Unknown");
    sentA.push(parseFloat(a.sentiment_score ?? 0));
    sentB.push(parseFloat(b.sentiment_score ?? 0));
    frA.push(parseFloat(a.frustration_score ?? 0));
    frB.push(parseFloat(b.frustration_score ?? 0));
  });

  const kappa = cohenKappa(labelsA, labelsB);
  const rSent = pearson(sentA, sentB);
  const rFr = pearson(frA, frB);

  let warning = "";
  if (kappa < 0.65) {
    const cm = confusionMatrix(labelsA, labelsB);
    let worst = { pair: ["", ""], count: -1 };
    ACTIONS.forEach(a => ACTIONS.forEach(b => {
      if (a !== b && cm[a][b] > worst.count) worst = { pair: [a,b], count: cm[a][b] };
    }));
    warning = `WARNING: Kappa < 0.65. Consider collapsing most-confused classes: ${worst.pair[0]} and ${worst.pair[1]}.`;
  }

  document.getElementById("iaaOut").textContent = JSON.stringify({
    common_items: common.length,
    cohen_kappa_action_label: kappa,
    pearson_sentiment: rSent,
    pearson_frustration: rFr,
    warning
  }, null, 2);
}

document.getElementById("turnIndexInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  indexRows = parseCsv(text).map((r, i) => ({ ...r, _id: `${r.conv_id}:${r.turn_id}:${i}` }));
  document.getElementById("sampleBtn").disabled = false;
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  sampled = stratifiedSample(indexRows, 150);
  pos = 0;
  annMap = new Map();
  document.getElementById("downloadBtn").disabled = false;
  document.getElementById("prevBtn").disabled = false;
  document.getElementById("nextBtn").disabled = false;
  renderTurn();
});

document.getElementById("downloadBtn").addEventListener("click", exportAnnotations);
document.getElementById("prevBtn").addEventListener("click", () => { saveCurrent(); pos = Math.max(0, pos - 1); renderTurn(); });
document.getElementById("nextBtn").addEventListener("click", () => { saveCurrent(); pos = Math.min(sampled.length - 1, pos + 1); renderTurn(); });

document.getElementById("annA").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  annAData = parseAnnFile(await f.text());
  document.getElementById("computeIaaBtn").disabled = !(annAData && annBData);
});
document.getElementById("annB").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  annBData = parseAnnFile(await f.text());
  document.getElementById("computeIaaBtn").disabled = !(annAData && annBData);
});
document.getElementById("computeIaaBtn").addEventListener("click", computeIAA);
</script>
</body>
</html>
